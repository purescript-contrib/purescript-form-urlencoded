      githubRepo: purescript-form-urlencoded
  build:
    strict: true
  dependencies:
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - js-uri: ">=3.0.0 <4.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - prelude: ">=6.0.0 <7.0.0"
